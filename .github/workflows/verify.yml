name: Verify public source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Python version
        run: python --version
      - name: Controller regression on Linux
        run: |
          python -m unittest discover -s device/imx6ull/tests -p 'test_*.py'
          bash device/imx6ull/scripts/build.sh
      - name: Install PC dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0
          python -m pip install -r requirements.txt
      - name: PC regression
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q pc/tests
